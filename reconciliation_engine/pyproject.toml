[project]
name = "reconciliation-engine"
version = "0.1.0"
description = "RevenueIQ Three-Way Settlement Reconciliation Engine"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "strands-agents>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
