syntax = "proto3";

package warehouse_service;

option go_package = "github.com/RevenueIQ/revenueiq_dev_kit/proto/warehouse_service;warehouse_proto";

service WarehouseService {
  rpc RegisterBusiness (RegisterBusinessRequest) returns (BusinessResponse);
  rpc RegisterWarehouse (RegisterWarehouseRequest) returns (WarehouseResponse);
  rpc AddInventory (AddInventoryRequest) returns (InventoryResponse);
  rpc GetInventory (GetInventoryRequest) returns (InventoryResponse);
  rpc VerifyPackage (VerifyPackageRequest) returns (VerifyPackageResponse);
  rpc QueueForPickup (QueuePickupRequest) returns (PickupResponse);
  rpc DispatchPackage (DispatchPackageRequest) returns (DispatchResponse);
}

message Business {
  string business_id = 1;
  string name = 2;
  string owner_email = 3;
  string category = 4;
  int64 registered_at = 5;
}

message RegisterBusinessRequest {
  Business business = 1;
}

message BusinessResponse {
  bool success = 1;
  string message = 2;
  Business business = 3;
}

message Warehouse {
  string warehouse_id = 1;
  string business_id = 2;
  string name = 3;
  string address = 4;
  double latitude = 5;
  double longitude = 6;
  int64 registered_at = 7;
}

message RegisterWarehouseRequest {
  Warehouse warehouse = 1;
}

message WarehouseResponse {
  bool success = 1;
  string message = 2;
  Warehouse warehouse = 3;
}

message InventoryItem {
  string sku = 1;
  string business_id = 2;
  string warehouse_id = 3;
  string name = 4;
  string description = 5;
  int32 quantity = 6;
  double weight_kg = 7;
  double length_cm = 8;
  double width_cm = 9;
  double height_cm = 10;
  string image_url = 11;
  string image_s3_key = 12;
  int64 updated_at = 13;
}

message AddInventoryRequest {
  InventoryItem item = 1;
  bytes image_bytes = 2;
  string image_filename = 3;
}

message GetInventoryRequest {
  string business_id = 1;
  string warehouse_id = 2;
  string sku = 3;
}

message InventoryResponse {
  bool success = 1;
  string message = 2;
  repeated InventoryItem items = 3;
  int32 total_count = 4;
}

message VerifyPackageRequest {
  string order_id = 1;
  string drone_id = 2;
  double package_weight_kg = 3;
  double length_cm = 4;
  double width_cm = 5;
  double height_cm = 6;
}

message VerifyPackageResponse {
  bool fits_capacity = 1;
  string message = 2;
  double drone_max_capacity_kg = 3;
}

message QueuePickupRequest {
  string order_id = 1;
  string warehouse_id = 2;
  string sku = 3;
  int32 quantity = 4;
}

message PickupResponse {
  bool success = 1;
  string message = 2;
  string queue_id = 3;
  int32 queue_position = 4;
}

message DispatchPackageRequest {
  string order_id = 1;
  string drone_id = 2;
  string warehouse_id = 3;
}

message DispatchResponse {
  bool success = 1;
  string message = 2;
  int64 dispatched_at = 3;
}
