syntax = "proto3";

package payment_service;

option go_package = "github.com/RevenueIQ/revenueiq_dev_kit/proto/payment_service;payment_proto";

service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
  rpc RefundPayment (RefundRequest) returns (PaymentResponse);
  rpc GetWallet (WalletRequest) returns (WalletResponse);
  rpc TopUpWallet (TopUpRequest) returns (WalletResponse);
  rpc GetTransactions (TxRequest) returns (TxResponse);
}

message PaymentRequest {
  string order_id = 1;
  string user_id = 2;
  double amount = 3;
  string currency = 4; // e.g. INR
  string payment_method = 5; // e.g. RAZORPAY, WALLET
  string razorpay_payment_id = 6;
  string razorpay_order_id = 7;
  string razorpay_signature = 8;
}

message TransactionRecord {
  string transaction_id = 1;
  string order_id = 2;
  string user_id = 3;
  double amount = 4;
  string currency = 5;
  string type = 6; // e.g. PAYMENT, REFUND, WALLET_TOPUP
  string status = 7; // e.g. SUCCESS, FAILED, PENDING, REFUNDED
  string payment_method = 8;
  string razorpay_payment_id = 9;
  string razorpay_order_id = 10;
  string razorpay_refund_id = 11;
  int64 timestamp = 12;
}

message PaymentResponse {
  bool success = 1;
  string message = 2;
  TransactionRecord transaction = 3;
}

message RefundRequest {
  string order_id = 1;
  string transaction_id = 2;
  double amount = 3;
  string reason = 4;
}

message WalletRequest {
  string user_id = 1;
}

message WalletResponse {
  string user_id = 1;
  double balance = 2;
  string currency = 3;
  int64 updated_at = 4;
}

message TopUpRequest {
  string user_id = 1;
  double amount = 2;
  string payment_method = 3;
  string razorpay_payment_id = 4;
}

message TxRequest {
  string user_id = 1;
  int32 limit = 2;
}

message TxResponse {
  repeated TransactionRecord transactions = 1;
  int32 total_count = 2;
}
