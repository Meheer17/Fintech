                          route:
                            cluster: payment_service_http
                            timeout: 10s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 3
                              retry_back_off:
                                base_interval: 0.1s
                                max_interval: 1s
                        - match:
                            prefix: "/api/warehouse/health"
                          route:
