version: '3.8'

services:
  # ─── INFRASTRUCTURE LAYER ───

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: revenueiq-mongodb-${STACK_NAME:-dev}
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      backend:
        aliases:
          - mongodb
      frontend:

  # Redis Database
  redis:
    image: redis:8.0-alpine
    container_name: revenueiq-redis-${STACK_NAME:-dev}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      backend:
        aliases:
          - redis

  # Redpanda Event Broker (Kafka compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: revenueiq-redpanda-${STACK_NAME:-dev}
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases:
          - redpanda

  # ─── CONSOLIDATED CORE GO ENGINE ───

  core-engine:
    image: ghcr.io/${OWNER:-revenueiq}/core_engine:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: core_engine/Dockerfile
    container_name: revenueiq-core-engine-${STACK_NAME:-dev}
    ports:
      - "8005:8005"
      - "8001:8001"
      - "8008:8008"
    environment:
      - PORT=50005
      - HTTP_PORT=8005
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=revenueiq_db
      - REDPANDA_ADDR=redpanda:29092
      - FAILURE_DETECTOR_URL=http://ai-engine:50002
      - RECOVERY_ORCHESTRATOR_URL=http://ai-engine:50003
      - RECONCILIATION_ENGINE_URL=http://ai-engine:50004
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_SESIqmsJZRvpZ1}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-4qzbtZYU4wrF4ER3lYk2hIt7}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8005"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - dashboard-api
          - mongo-service
          - audit-service
          - webhook-receiver
          - checkout-tracker
          - auth-service
          - redis-service
      frontend:

  # ─── CONSOLIDATED PYTHON AI ENGINE ───

  ai-engine:
    image: ghcr.io/${OWNER:-revenueiq}/ai_engine:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: ai_engine/Dockerfile
    container_name: revenueiq-ai-engine-${STACK_NAME:-dev}
    ports:
      - "8006:8006"
      - "50002:50002"
      - "50003:50003"
      - "50004:50004"
    environment:
      - PORT=8006
      - DASHBOARD_API_URL=http://core-engine:8005/api/v1
      - MONGO_SERVICE_ADDR=core-engine:50010
      - REDPANDA_ADDR=redpanda:29092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://bedrock-mantle.ap-south-1.api.aws/v1}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_SESIqmsJZRvpZ1}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-4qzbtZYU4wrF4ER3lYk2hIt7}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      core-engine:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - ai-gateway
          - failure-detector
          - recovery-orchestrator
          - reconciliation-engine
      frontend:

  # ─── FRONTEND DASHBOARD (Vite Dev Mode) ───

  frontend:
    image: ghcr.io/${OWNER:-revenueiq}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: revenueiq-frontend-${STACK_NAME:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_DASHBOARD_API_URL=http://localhost:8005
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      core-engine:
        condition: service_healthy
    networks:
      - frontend

volumes:
  mongodb-data:
    name: revenueiq-mongodb-data-${STACK_NAME:-dev}
  redis-data:
    name: revenueiq-redis-data-${STACK_NAME:-dev}

networks:
  frontend:
  backend:
