apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: revenueiq-system
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/${OWNER}/auth-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 50053
              name: grpc
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "50053"
            - name: HTTP_PORT
              value: "8081"
            - name: MONGO_SERVICE_ADDR
              value: "mongodb-service:50051"
            - name: REDIS_SERVICE_ADDR
              value: "redis-service:50052"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: revenueiq-secrets
                  key: jwt-secret
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: revenueiq-system
spec:
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app: auth-service
