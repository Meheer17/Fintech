apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-service
  namespace: revenueiq-system
  labels:
    app: mongodb-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-service
  template:
    metadata:
      labels:
        app: mongodb-service
    spec:
      containers:
        - name: mongodb-service
          image: ghcr.io/${OWNER}/mongodb-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: revenueiq-secrets
                  key: mongo-uri
            - name: MONGO_DB
              value: "mongodb_service_db"
            - name: MONGO_COLLECTION
              value: "users"
            - name: PORT
              value: "50051"
            - name: REDIS_CACHE_ADDR
              value: "redis-service:50052"
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: revenueiq-system
spec:
  ports:
    - port: 50051
      targetPort: 50051
  selector:
    app: mongodb-service
