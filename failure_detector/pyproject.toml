[project]
name = "failure-detector"
version = "0.1.0"
description = "RevenueIQ Payment Failure Detector and AI Diagnosis Agent"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "strands-agents>=0.1.0",
    "confluent-kafka>=2.3.0",
    "pydantic>=2.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
